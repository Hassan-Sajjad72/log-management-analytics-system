<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Log Management Analytics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: var(--bg-app);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        /* Brand header — matches sidebar brand */
        .login-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }
        .login-brand .brand-logo {
            width: 36px; height: 36px;
            background: var(--accent-color);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-brand .brand-logo svg { color: white; }
        .login-brand-text {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        /* Card — matches dashboard cards */
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-md);
        }
        .login-card h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }
        .login-card .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* RLS info chip */
        .rls-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f0f0ff;
            border: 1px solid #e0e0ff;
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            margin-bottom: 24px;
            width: 100%;
        }
        .rls-chip svg { color: #6366f1; flex-shrink: 0; }
        .rls-chip-text {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .rls-chip-text strong { color: #6366f1; }

        /* Form — matches .form-group from dashboard */
        .login-field {
            margin-bottom: 16px;
        }
        .login-field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }
        .login-field input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-app);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .login-field input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.08);
        }
        .login-field input::placeholder {
            color: var(--text-tertiary);
        }

        /* Error message */
        .login-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #dc2626;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .login-error svg { flex-shrink: 0; }

        /* Submit — matches primary-button from dashboard */
        .login-submit {
            width: 100%;
            padding: 11px;
            background: var(--accent-color);
            color: var(--accent-text);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background 0.15s ease;
            letter-spacing: -0.01em;
            margin-top: 4px;
        }
        .login-submit:hover {
            background: var(--accent-hover);
        }

        /* Demo credentials */
        .demo-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-subtle);
        }
        .demo-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-tertiary);
            margin-bottom: 10px;
        }
        .demo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .demo-user {
            background: var(--bg-app);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
        }
        .demo-user:hover {
            border-color: var(--border-focus);
            background: var(--bg-hover);
        }
        .demo-user-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }
        .demo-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .demo-user-team {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .demo-user-email {
            font-size: 10px;
            color: var(--text-tertiary);
            font-family: 'SF Mono', 'Cascadia Code', monospace;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-tertiary);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-brand">
            <div class="brand-logo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            </div>
            <span class="login-brand-text">LMA Platform</span>
        </div>

        <div class="login-card">
            <h1>Sign in to your account</h1>
            <p class="subtitle">PostgreSQL Row-Level Security enforces data access by team.</p>

            <div class="rls-chip">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span class="rls-chip-text">
                    <strong>RLS Active</strong> — Your team role determines which logs the database returns.
                </span>
            </div>

            {% if error %}
            <div class="login-error">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="login-field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@company.io" autocomplete="email" required>
                </div>
                <div class="login-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-submit">Sign In</button>
            </form>

            <div class="demo-section">
                <div class="demo-title">Demo Accounts</div>
                <div class="demo-grid">
                    <button class="demo-user" onclick="fillLogin('admin@logiq.io','admin123')">
                        <div class="demo-user-header">
                            <span class="demo-dot" style="background:#6366f1;"></span>
                            <span class="demo-user-team">Admin</span>
                        </div>
                        <div class="demo-user-email">admin@logiq.io</div>
                    </button>
                    <button class="demo-user" onclick="fillLogin('dev@frontend.io','frontend123')">
                        <div class="demo-user-header">
                            <span class="demo-dot" style="background:#06b6d4;"></span>
                            <span class="demo-user-team">Frontend</span>
                        </div>
                        <div class="demo-user-email">dev@frontend.io</div>
                    </button>
                    <button class="demo-user" onclick="fillLogin('dev@backend.io','backend123')">
                        <div class="demo-user-header">
                            <span class="demo-dot" style="background:#10b981;"></span>
                            <span class="demo-user-team">Backend</span>
                        </div>
                        <div class="demo-user-email">dev@backend.io</div>
                    </button>
                    <button class="demo-user" onclick="fillLogin('dba@database.io','database123')">
                        <div class="demo-user-header">
                            <span class="demo-dot" style="background:#f59e0b;"></span>
                            <span class="demo-user-team">Database</span>
                        </div>
                        <div class="demo-user-email">dba@database.io</div>
                    </button>
                </div>
            </div>
        </div>

        <div class="login-footer">
            Advanced DBMS Project · PostgreSQL Row-Level Security Demo
        </div>
    </div>

    <script>
    function fillLogin(email, password) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = password;
    }
    </script>
</body>
</html>
