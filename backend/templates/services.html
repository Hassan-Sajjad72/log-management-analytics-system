{% extends "base.html" %}

{% block content %}
<h1 class="page-title">Registered Services</h1>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Service Name</th>
                <th>Owner Team</th>
            </tr>
        </thead>
        <tbody>
            {% for service in services %}
            <tr>
                <td style="font-feature-settings: 'tnum'; color: var(--text-secondary);">#{{ service.service_id }}</td>
                <td style="font-weight: 500;">{{ service.service_name }}</td>
                <td>{{ service.owner_team }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
