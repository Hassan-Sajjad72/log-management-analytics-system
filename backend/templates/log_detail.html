{% extends "base.html" %}

{% block content %}
<h1 class="page-title">Log Inspector</h1>

<div class="table-container">
    <table>
        <tbody>
            {% for key, value in log.items() %}
            <tr>
                <td style="font-weight: 500; color: var(--text-secondary); width: 200px; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; background: #fafafa;">{{ key }}</td>
                <td style="font-family: monospace; font-size: 13px; word-break: break-all;">
                    {% if key == 'metadata' and value %}
                        <pre style="margin: 0; background: var(--bg-hover); padding: 8px; border-radius: 4px; overflow-x: auto;">{{ value | tojson(indent=2) }}</pre>
                    {% else %}
                        {{ value }}
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
